<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Comercial · Logística Total</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#191919; --ink2:#666666; --line:#e7e7e7; --axis:#c2c2c2;
  --brand:#1f3a5f; --brand2:#2b5486; --accent:#257de0; --hover:#f0f5fc;
  --up:#006c10; --down:#dc3c3d; --warn:#b07800;
  --s1:#257de0; --s2:#f47230; --s3:#00b894; --s4:#f2a600; --s5:#ee7fac; --s6:#008a17; --s7:#6a4ce2; --s8:#9c9c9c;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,select,input{font:inherit}
.hidden{display:none!important}

/* header */
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;position:sticky;top:0;z-index:30}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
header .estado{font-size:12px;opacity:.85;margin-left:auto;text-align:right}
header button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 10px;cursor:pointer}
header button:hover{background:rgba(255,255,255,.22)}
nav.tabs{display:flex;gap:2px;background:var(--brand);padding:0 12px;position:sticky;top:46px;z-index:29;overflow-x:auto}
nav.tabs button{background:none;border:0;color:#c9d6e8;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button.on{color:#fff;border-bottom-color:#7fb4f5}
nav.tabs button:hover{color:#fff}

/* filtros */
.filtros{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:85px;z-index:28}
.f{position:relative}
.f>button{background:#fff;border:1px solid #d5d9e0;border-radius:6px;padding:4px 9px;cursor:pointer;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.f>button b{font-weight:600;color:var(--ink2);margin-right:4px;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.f.activo>button{border-color:var(--accent);background:#eef5fd}
.f select{border:1px solid #d5d9e0;border-radius:6px;padding:4px 6px;background:#fff}
.pop{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #d5d9e0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);width:280px;z-index:50;padding:8px}
.pop input[type=search]{width:100%;padding:5px 8px;border:1px solid #d5d9e0;border-radius:6px;margin-bottom:6px}
.pop .lista{max-height:280px;overflow:auto}
.pop label{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer}
.pop label:hover{background:var(--hover)}
.pop .acc{display:flex;justify-content:space-between;margin-top:6px;gap:6px}
.pop .acc button{border:1px solid #d5d9e0;background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer}
.limpiar{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 6px}

main{padding:14px;max-width:1700px;margin:0 auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h3{margin:0 0 2px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;color:var(--ink2);font-size:12px}
.card .tools{margin-left:auto;display:flex;gap:6px}
.card .tools button,.btn{border:1px solid #d5d9e0;background:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px;color:var(--ink2)}
.card .tools button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
.nota{color:var(--ink2);font-size:12px;margin:2px 0 8px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.tile .t{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.tile .v{font-size:24px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--ink2);margin-top:2px}

/* tablas */
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:6px;margin-top:8px}
table.tt{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.tt th{position:sticky;top:0;background:#f7f8fa;z-index:2;font-weight:600;color:var(--ink2);font-size:11.5px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tt th:first-child{text-align:left;left:0;z-index:3}
.tt th.sorted::after{content:" ▾";color:var(--accent)}
.tt th.sorted.asc::after{content:" ▴"}
.tt td{padding:4px 8px;border-bottom:1px solid #f0f0f0;text-align:right;white-space:nowrap}
.tt td:first-child{text-align:left;position:sticky;left:0;background:inherit;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.tt tr{background:#fff}
.tt tr:hover{background:var(--hover)}
.tt tr.l0 td{font-weight:600}
.tt tr.l1 td:first-child{padding-left:24px}
.tt tr.l2 td:first-child{padding-left:42px;color:#333}
.tt tr.l3 td:first-child{padding-left:58px;color:#444}
.tt tr.total td{font-weight:700;background:#eef2f7;position:sticky;bottom:0;border-top:1px solid #d5d9e0}
.tt .tg{display:inline-block;width:14px;color:var(--ink2);cursor:pointer}
.tt .grp{border-left:1px solid var(--line)}
.up{color:var(--up)} .down{color:var(--down)}
.pct-ok{color:var(--up);font-weight:600}
.pct-mid{color:var(--warn);font-weight:600}
.pct-low{color:var(--down);font-weight:600}
.cnc{color:var(--down);font-weight:700}
.mas{display:block;margin:6px auto 0}
.buscar-t{border:1px solid #d5d9e0;border-radius:6px;padding:2px 8px;font-size:12px;width:200px}
.seg{display:inline-flex;border:1px solid #d5d9e0;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 12px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--brand);color:#fff}

/* gráfico */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:6px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:#191919;color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tip td{padding:0 4px} .tip td:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* login / carga */
.pantalla{min-height:calc(100vh - 46px);display:flex;align-items:center;justify-content:center;padding:20px}
.caja{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 28px;width:360px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.caja h2{margin:0 0 4px;font-size:18px}
.caja p{color:var(--ink2);margin:0 0 16px}
.caja input{width:100%;padding:8px 10px;border:1px solid #d5d9e0;border-radius:6px;margin-bottom:10px}
.caja .prim{width:100%;background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px;cursor:pointer;font-weight:600}
.caja .sec{width:100%;background:#fff;color:var(--brand);border:1px solid var(--brand);border-radius:6px;padding:8px;cursor:pointer;margin-top:10px}
.err{color:var(--down);font-size:12px;min-height:16px}
.cargando{color:var(--ink2);padding:40px;text-align:center}
.caja .google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #d5d9e0;border-radius:6px;padding:9px;cursor:pointer;font-weight:600;color:#333}
.caja .google:hover{background:#f7f8fa}
.caja .o{text-align:center;color:var(--ink2);font-size:12px;margin:12px 0}
.pill{background:#fff3cd;color:#7a5a00;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:4px}
.inp{border:1px solid #d5d9e0;border-radius:5px;padding:3px 6px;font:inherit;background:#fff;min-width:140px}
.btn.prim{background:var(--brand);color:#fff;border-color:var(--brand);padding:5px 14px;margin-top:8px}
.btn.prim:hover{background:var(--brand2);color:#fff}
.badge{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;font-weight:700;vertical-align:1px}
.badge.rojo{background:#fde2e2;color:var(--down)} .badge.verde{background:#dff3e3;color:var(--up)}
tr.tachado td{text-decoration:line-through;opacity:.5}
.aviso{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
.aviso.ok{background:#006c10} .aviso.warn{background:#9a6a00} .aviso.err{background:#dc3c3d}
@media (max-width:700px){ .g2{grid-template-columns:1fr} .filtros{position:static} nav.tabs{top:46px} }
</style>
</head>
<body>
<header>
  <h1>Tablero Comercial · Logística Total</h1>
  <div class="estado" id="estado"></div>
  <button id="btnRecargar" class="hidden" title="Buscar datos nuevos">Actualizar</button>
  <button id="btnSalir" class="hidden">Salir</button>
</header>

<div id="pantallaLogin" class="pantalla hidden">
  <div class="caja">
    <h2>Ingresar</h2>
    <p>Tablero comercial de Logística Total.</p>
    <button class="google" id="btnGoogle"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Entrar con Google</button>
    <div class="o">o con usuario y clave</div>
    <input id="email" type="email" placeholder="correo" autocomplete="username">
    <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password">
    <div class="err" id="errLogin"></div>
    <button class="prim" id="btnLogin">Entrar</button>
    <button class="sec" id="btnArchivo1">Abrir archivo de datos (sin internet)</button>
  </div>
</div>
<div id="pantallaArchivo" class="pantalla hidden">
  <div class="caja">
    <h2>Abrir datos</h2>
    <p>Elegí el archivo <b>datos_tablero.json.gz</b> que deja el script en la carpeta API.</p>
    <button class="prim" id="btnArchivo2">Elegir archivo…</button>
    <div class="err" id="errArchivo"></div>
  </div>
</div>
<input type="file" id="inArchivo" accept=".gz,.json" class="hidden">
<div id="cargando" class="cargando hidden">Cargando datos…</div>

<div id="app" class="hidden">
  <nav class="tabs" id="tabs"></nav>
  <div class="filtros" id="filtros"></div>
  <main id="main"></main>
</div>

<script type="module">
// ============================================================================ CONFIG
// Pegá acá la configuración web de Firebase (la misma del planificador:
// Consola de Firebase > Configuración del proyecto > Tus apps > SDK config).
const FIREBASE_CONFIG = {
  // apiKey: "...", authDomain: "planificador-logistica-total.firebaseapp.com",
  // projectId: "planificador-logistica-total", appId: "...",
};
const COLECCION = "tablero_docs";

// KPIs (mismas reglas que las medidas DAX del Power BI)
//  modo "s" = el cliente suma cantidad > 0 en el mes; modo "p" = tuvo alguna línea con cantidad > 0
const KPIS = {
  "CCC CZA":         {f: a => a.un === 1, m: "s", obj: "CCC CZA"},
  "CCC LATONES":     {f: a => a.cal === 566, m: "s", obj: "CCC LATONES"},
  "CCC LATITAS":     {f: a => a.cod === 15624 || a.cod === 63068, m: "p", obj: "CCC INNOV CORE"},
  "CCC BC":          {f: a => [88,356,531,609,817,172,775].includes(a.marca), m: "s", obj: "CCC BC"},
  "CCC PURE GOLD":   {f: a => a.marca === 817, m: "s", obj: "CCC PURE GOLD"},
  "CCC MICHELOB":    {f: a => [88,356,531].includes(a.marca), m: "p", obj: "CCC MICHELOB"},
  "CCC 0.0":         {f: a => [609,172,775].includes(a.marca), m: "p", obj: "CCC 0.0"},
  "CCC UNG":         {f: a => a.un === 3, m: "s", obj: "CCC UNG"},
  "CCC H2OH":        {f: a => a.marca === 95, m: "s", obj: "CCC H2Oh"},
  "CCC PEPSI BLACK": {f: a => /black/i.test(a.nombre), m: "s", obj: "CCC PEPSI BLACK"},
  "CCC GATORADE":    {f: a => a.marcaDs === "GATORADE", m: "s", obj: "CCC GATORADE"},
  "CCC RED BULL":    {f: a => a.un === 3 && a.marca === 358, m: "s", obj: "CCC RED BULL"},
};
const CNC_DEF = {
  "CNC CZA": a => a.un === 1, "CNC LATONES": a => a.cal === 566,
  "CNC INNOV CORE": a => [15624,63068,32471,32472].includes(a.cod), "CNC 0.0": a => [609,172,775].includes(a.marca),
  "CNC MICHELOB": a => [88,356,531].includes(a.marca), "CNC PURE GOLD": a => a.marca === 817,
  "CNC UNG": a => a.un === 3, "CNC GATORADE": a => a.marcaDs === "GATORADE",
  "CNC RED BULL": a => a.un === 3 && a.marca === 358, "CNC H2OH": a => a.marca === 95,
};
const UN_EXCLUIR_CCC_MES = ["VINO", "ADYACENCIAS", "MARKETPLACE ALIMENTOS", ""];
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7"].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const OTROS_COLOR = getComputedStyle(document.documentElement).getPropertyValue("--s8").trim();
const MESES_TXT = ["", "ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

// ============================================================================ utilidades
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const nf1 = new Intl.NumberFormat("es-AR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const nf0 = new Intl.NumberFormat("es-AR", {maximumFractionDigits: 0});
const fHL = v => v == null || isNaN(v) || Math.abs(v) < 0.05 ? "" : nf1.format(v);
const fInt = v => v == null || isNaN(v) || v === 0 ? "" : nf0.format(v);
const fIntZ = v => v == null || isNaN(v) ? "" : nf0.format(v);
const fPct = v => v == null || !isFinite(v) ? "" : nf1.format(v * 100) + "%";
const fVarPct = v => v == null || !isFinite(v) ? "" : (v >= 0 ? "▲ +" : "▼ ") + nf1.format(v * 100) + "%";
const fVar = v => v == null || isNaN(v) ? "" : v === 0 ? "0" : (v > 0 ? "▲ +" : "▼ ") + nf0.format(v);
const clsVar = v => v == null || !isFinite(v) || v === 0 ? "" : v > 0 ? "up" : "down";
const clsObj = v => v == null || !isFinite(v) ? "" : v >= 1 ? "pct-ok" : v >= 0.9 ? "pct-mid" : "pct-low";
const norm = s => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
const mesTxt = m => `${MESES_TXT[+m.slice(5)]} ${m.slice(2, 4)}`;
const mesTxtLargo = m => `${["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][+m.slice(5)]} ${m.slice(0,4)}`;
const sumarMes = (m, n) => { let y = +m.slice(0, 4), mm = +m.slice(5) + n; while (mm > 12) { y++; mm -= 12; } while (mm < 1) { y--; mm += 12; } return `${y}-${String(mm).padStart(2, "0")}`; };

async function gunzipBytes(bytes) {
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}
async function desdeB64(b64) {
  const bin = atob(b64); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return JSON.parse(await gunzipBytes(u));
}

// ---------- cache en el navegador (IndexedDB)
const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open("tablero_lt", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("docs");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k) { try { const db = await this.open(); return await new Promise(r => { const q = db.transaction("docs").objectStore("docs").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(r => { const t = db.transaction("docs", "readwrite"); t.objectStore("docs").put(v, k); t.oncomplete = r; t.onerror = r; }); } catch {} },
};

// ============================================================================ datos
const D = {};   // modelo en memoria

function armarModelo(docs) {
  const b = docs.base;
  D.base = b; D.hoy = b.corte || b.hoy; D.mesActual = D.hoy.slice(0, 7); D.conPedidos = !!b.conPedidos;
  D.feriados = new Set(b.feriados || []);
  // artículos (datos crudos de Chess; las agrupaciones se aplican en aplicarMapeos)
  const A = b.art.map(r => ({cod: r[0], nombre: r[1], marca: r[2], marcaDs: r[3] || "", cal: r[4], calDs: r[5], sabor: r[6],
                             un: r[7], unDs: r[8] || "", hlBulto: r[9], bxp: r[10]}));
  const artIdx = new Map(A.map((a, i) => [a.cod, i]));
  // clientes
  const C = b.cli.map(r => ({cod: r[0], razon: r[1], supChess: r[2] || "", vend: r[3] || "(sin vendedor)",
                             sub: r[4] || "(sin subcanal)", loc: r[5] || "(sin localidad)", anulado: r[6] ? "SI" : "NO", dias: r[7] || "(sin día)"}));
  const cliIdx = new Map(C.map((c, i) => [c.cod, i]));
  const M = {};
  for (const [k, d] of Object.entries(docs)) {
    if (!k.startsWith("mes_")) continue;
    const n = d.c.length, ci = new Int32Array(n), ai = new Int32Array(n), hl = new Float64Array(n), pos = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      let c = cliIdx.get(d.c[i]);
      if (c === undefined) { c = C.length; cliIdx.set(d.c[i], c); C.push({cod: d.c[i], razon: "(no está en el maestro)", supChess: "", vend: "(sin vendedor)", sub: "(sin subcanal)", loc: "(sin localidad)", anulado: "SI", dias: "(sin día)", fantasma: true}); }
      let a = artIdx.get(d.a[i]);
      if (a === undefined) { a = A.length; artIdx.set(d.a[i], a); A.push({cod: d.a[i], nombre: "(artículo " + d.a[i] + ")", marca: 0, marcaDs: "", cal: 0, calDs: "", sabor: "", un: 0, unDs: "", hlBulto: 0, bxp: 0}); }
      ci[i] = c; ai[i] = a; hl[i] = d.h[i]; pos[i] = d.p[i];
    }
    M[d.mes] = {n, ci, ai, hl, pos};
  }
  C.forEach(c => c.label = `${c.cod} - ${c.razon}`);
  D.A = A; D.C = C; D.M = M; D.meses = Object.keys(M).sort();
  D.obj = new Map(); D.objVend = new Map();
  for (const [mes, sup, vend, kpi, val] of b.obj || []) {
    if (!D.objVend.has(mes)) D.objVend.set(mes, new Set());
    D.objVend.get(mes).add(vend);
    for (const k of [`${mes}|V|${norm(vend)}`, `${mes}|S|${norm(sup)}`, `${mes}|T|`]) {
      const o = D.obj.get(k) || {}; o[kpi] = (o[kpi] || 0) + val; D.obj.set(k, o);
    }
  }
}

// Canal por regla (la misma lógica que tenía el Power BI), para subcanales que no están en la lista
function canalPorRegla(sub) {
  const s = norm(sub); if (!s) return "OTROS";
  const ini = [["VARIOS SAUCO","OTROS"],["SUPERMERCADOS","OTROS"],["RESTAURANT","REF"],["PUB","REF"],["PIZZER","REF"],["OTROS REFRIGERAD","REF"],
    ["MAYORISTA","MAY"],["KA","REF"],["HOTEL","REF"],["HAMBURGUES","REF"],["COMIDAS","REF"],["COM P","REF"],["REG ","REF"],["BASE ","REF"],["TOP ","REF"],
    ["CADENA","REF"],["EST DE SERV","REF"],["CANCHAS","REF"],["CATERING","REF"],["HIPERMERCADOS","OTROS"],["AUTOSERVICIO","AS"]];
  for (const [p, c] of ini) if (s.startsWith(p)) return c;
  for (const [p, c] of [["GIMNASIO","REF"],["FLETEROS","OTROS"],["EVENTOS","REF"],["ENTRETENIMIENTO","REF"],["EMPRESA","REF"],["EDUCAC","REF"],["DISCO","REF"]]) if (s.includes(p)) return c;
  return "K+T";
}
const CANALES = ["K+T", "REF", "AS", "MAY", "OTROS"];
const SEGMENTOS = ["CORE", "PREMIUM", "VALUE", "NO APLICABLE"];

// Aplica las listas de AJUSTES (marcas agrupadas, supervisores, canales, TOP, P1&P4, días)
function aplicarMapeos(mp) {
  mp = mp || {};
  D.mapeos = {marcas: mp.marcas || [], supervisores: mp.supervisores || [], canales: mp.canales || [], top: mp.top || [], p1p4: mp.p1p4 || [], dias: mp.dias || []};
  const mMarca = new Map(D.mapeos.marcas.map(r => [norm(r[0]), r])), mSup = new Map(D.mapeos.supervisores.filter(r => r[1]).map(r => [norm(r[0]), r[1]]));
  const mCanal = new Map(D.mapeos.canales.filter(r => r[1]).map(r => [norm(r[0]), r[1]]));
  const top = new Set(D.mapeos.top.map(Number)), p1 = new Set(D.mapeos.p1p4.map(Number));
  D.diasOverride = new Map(D.mapeos.dias.map(r => [r[0], +r[1]]));
  for (const a of D.A) {
    const m = mMarca.get(norm(a.marcaDs));
    a.marcaAgr = m && m[1] ? m[1] : (a.marcaDs || "(en blanco)");
    a.segCza = m && m[2] ? m[2] : "NO APLICABLE";
    a.sinMapa = !m && !!a.marcaDs;
    a.top = top.has(a.cal) ? "TOP" : "NO TOP";
    a.bc = [88,356,531,609,817,172,775].includes(a.marca) ? "BALANCED CHOICES" : "(resto)";
    a.cero = [609,172,775].includes(a.marca) ? "0 ALCOHOL" : "(resto)";
    a.calTxt = a.calDs || "(sin calibre)";
  }
  for (const c of D.C) {
    if (c.fantasma) { c.sup = "(sin maestro)"; c.canal = "OTROS"; c.p1p4 = false; continue; }
    const s = mSup.get(norm(c.vend));
    c.sup = s || c.supChess || "OTRO"; c.supDeChess = !s && c.vend !== "(sin vendedor)";
    const k = mCanal.get(norm(c.sub));
    c.canal = k || canalPorRegla(c.sub); c.canalRegla = !k && c.sub !== "(sin subcanal)";
    c.p1p4 = p1.has(c.cod);
  }
}

function valorDia(iso) {
  if (D.diasOverride?.has(iso)) return D.diasOverride.get(iso);
  if (D.feriados.has(iso)) return 0;
  const wd = new Date(iso + "T12:00:00").getDay();
  return wd === 0 ? 0 : wd === 6 ? 0.5 : 1;
}
function diasDelMes(mes) { const out = []; const d = new Date(mes + "-01T12:00:00"); while (d.toISOString().slice(0, 7) === mes) { out.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); } return out; }
function diasMes(mes) {
  let tot = 0, trans = 0;
  for (const d of diasDelMes(mes)) { const v = valorDia(d); tot += v; if (d <= D.hoy) trans += v; }
  return {tot, trans};
}

];
const SEL = {};          // k -> Set de valores elegidos
let MES = null;          // mes elegido
let cliOk, artOk;

function aplicarFiltros() {
  cliOk = new Uint8Array(D.C.length); artOk = new Uint8Array(D.A.length);
  const fc = FILTROS.filter(f => f.src === "c" && SEL[f.k]?.size), fa = FILTROS.filter(f => f.src === "a" && SEL[f.k]?.size);
  D.C.forEach((c, i) => { cliOk[i] = fc.every(f => SEL[f.k].has(f.get(c))) ? 1 : 0; });
  D.A.forEach((a, i) => { artOk[i] = fa.every(f => SEL[f.k].has(f.get(a))) ? 1 : 0; });
}

function opciones(f) {
  const set = new Set();
  const lista = f.src === "c" ? D.C : D.A;
  const dep = f.depende && SEL[f.depende]?.size ? FILTROS.find(x => x.k === f.depende) : null;
  for (const x of lista) { if (x.fantasma) continue; if (dep && !SEL[f.depende].has(dep.get(x))) continue; set.add(f.get(x)); }
  return [...set].sort((a, b) => a.localeCompare(b, "es"));
}

document.addEventListener("click", e => { if (popAbierto && !popAbierto.contains(e.target) && !e.target.closest(".f>button")) cerrarPop(); });

// ============================================================================ motor de cálculo
// recorre las ventas del mes que pasan los filtros
function scan(mes, fn, {ignorarArt = false, ignorarCli = false} = {}) {
  const m = D.M[mes]; if (!m) return;
  const {n, ci, ai, hl, pos} = m;
  for (let i = 0; i < n; i++) {
    const c = ci[i], a = ai[i];
    if (!ignorarCli && !cliOk[c]) continue;
    if (!ignorarArt && !artOk[a]) continue;
    fn(c, a, hl[i], pos[i]);
  }
}

// dimensiones para filas
const DIM = {

  cli:    {t: "Cliente", src: "c", get: c => D.C[c].label},
  canal:  {t: "Canal", src: "c", get: c => D.C[c].canal},
  sub:    {t: "Subcanal", src: "c", get: c => D.C[c].sub},
  un:     {t: "Unidad de negocio", src: "a", get: a => D.A[a].unDs || "(en blanco)"},
  magr:   {t: "Marca agrupada", src: "a", get: a => D.A[a].marcaAgr},

  art:    {t: "Artículo", src: "a", get: a => `${D.A[a].cod} - ${D.A[a].nombre}`},
};
const keyOf = (d, c, a) => DIM[d].src === "c" ? DIM[d].get(c) : DIM[d].get(a);

// árbol genérico: niveles + acumulador por nodo
function arbol(niveles, init) {
  const raiz = {label: "Total", kids: new Map(), acc: init(), nivel: -1};
  return {raiz, nodos(c, a) {
    const out = [raiz]; let n = raiz;
    for (let l = 0; l < niveles.length; l++) {
      const k = keyOf(niveles[l], c, a);
      let h = n.kids.get(k);
      if (!h) { h = {label: k, kids: new Map(), acc: init(), nivel: l}; n.kids.set(k, h); }
      out.push(h); n = h;
    }
    return out;
  }};
}

// ---- HL: LY / LM / AM / tendencia
function tablaHL(niveles, mes) {
  const T = arbol(niveles, () => [0, 0, 0]);
  const per = [sumarMes(mes, -12), sumarMes(mes, -1), mes];
  per.forEach((m, j) => scan(m, (c, a, h) => { for (const n of T.nodos(c, a)) n.acc[j] += h; }));
  const fac = factorTendencia(mes);
  const vals = acc => { const tend = acc[2] * fac; return [acc[0], acc[1], acc[2], tend, acc[0] ? tend / acc[0] - 1 : null, acc[1] ? tend / acc[1] - 1 : null]; };
  return {raiz: T.raiz, vals, cols: [
    {t: "HL LY", f: fHL, sub: mesTxt(per[0])}, {t: "HL LM", f: fHL, sub: mesTxt(per[1])}, {t: "HL AM", f: fHL, sub: mesTxt(per[2])},
    {t: fac !== 1 ? "Tendencia" : "Venta", f: fHL}, {t: "Var % LY", f: fVarPct, cls: clsVar}, {t: "Var % LM", f: fVarPct, cls: clsVar}],
    vacio: acc => !acc[0] && !acc[1] && !acc[2], orden: 2};
}
function factorTendencia(mes) {
  if (mes !== D.mesActual) return 1;
  const {tot, trans} = diasMes(mes);
  return trans > 0 ? tot / trans : 1;
}

// ---- CCC o BD por período (LY, LM, AM)
function tablaCCC(niveles, mes, tipo) {
  const per = [sumarMes(mes, -12), sumarMes(mes, -1), mes];
  const T = arbol(niveles, () => tipo === "bd" ? [0, 0, 0] : [new Map(), new Map(), new Map()]);
  per.forEach((m, j) => scan(m, (c, a, h, p) => {
    for (const n of T.nodos(c, a)) {
      if (tipo === "bd") { if (p) n.acc[j]++; }
      else if (!D.C[c].fantasma) n.acc[j].set(c, (n.acc[j].get(c) || 0) + h);
    }
  }));
  const contar = mp => { let k = 0; for (const v of mp.values()) if (v > 0) k++; return k; };
  const vals = acc => {
    const v = tipo === "bd" ? acc : acc.map(contar);
    return [v[0], v[1], v[2], v[2] - v[0], v[2] - v[1]];
  };
  const t = tipo === "bd" ? "BD" : "CCC";
  return {raiz: T.raiz, vals, cols: [
    {t: t + " LY", f: fInt, sub: mesTxt(per[0])}, {t: t + " LM", f: fInt, sub: mesTxt(per[1])}, {t: t + " AM", f: fInt, sub: mesTxt(per[2])},
    {t: "Var AM-LY", f: fVar, cls: clsVar}, {t: "Var AM-LM", f: fVar, cls: clsVar}],
    vacio: acc => tipo === "bd" ? !acc[0] && !acc[1] && !acc[2] : !acc[0].size && !acc[1].size && !acc[2].size, orden: 2};
}

// ---- KPIs con objetivos (filas Supervisor > Vendedor > Cliente)
function tablaKPI(kpis, conBD, mes) {
  const defs = kpis.map(k => KPIS[k]);
  const flags = D.A.map(a => defs.map(d => d.f(a)));
  const porCli = new Map();       // c -> {s: Float64Array, p: Uint8Array, bd}
  scan(mes, (c, a, h, p) => {
    let r = porCli.get(c);
    if (!r) { r = {s: new Float64Array(defs.length), p: new Uint8Array(defs.length), bd: 0}; porCli.set(c, r); }
    const fl = flags[a];
    for (let j = 0; j < defs.length; j++) if (fl[j]) { r.s[j] += h; if (p) r.p[j] = 1; }
    if (conBD && D.A[a].un === 3 && h > 0) r.bd++;
  });
  const T = arbol(["sup", "vend", "cli"], () => ({k: new Float64Array(defs.length), bd: 0, n: 0}));
  for (const [c, r] of porCli) {
    const real = !D.C[c].fantasma;   // CCC solo cuenta clientes del maestro (como en el Power BI)
    for (const n of T.nodos(c, 0)) {
      if (real) for (let j = 0; j < defs.length; j++) if (defs[j].m === "s" ? r.s[j] > 0 : r.p[j]) n.acc.k[j]++;
      n.acc.bd += r.bd; n.acc.n++;
    }
  }
  // objetivos por nodo
  const objDe = n => {
    if (n.nivel === -1) {   // total = suma de los supervisores que quedan visibles con los filtros
      const o = {};
      for (const h of n.kids.values()) { const x = D.obj.get(`${mes}|S|${norm(h.label)}`); if (h.acc.n && x) for (const [k, v] of Object.entries(x)) o[k] = (o[k] || 0) + v; }
      return o;
    }
    if (n.nivel === 0) return D.obj.get(`${mes}|S|${norm(n.label)}`);
    if (n.nivel === 1) return D.obj.get(`${mes}|V|${norm(n.label)}`);
    return null;
  };
  const cols = [];
  kpis.forEach((k, j) => {
    cols.push({t: k, f: fInt, grp: true});
    cols.push({t: "% obj", f: fPct, cls: clsObj});
    if (conBD && k === "CCC UNG") { cols.push({t: "BD UNG", f: fInt, grp: true}); cols.push({t: "% obj", f: fPct, cls: clsObj}); }
  });
  const vals = (acc, n) => {
    const o = objDe(n); const out = [];
    kpis.forEach((k, j) => {
      out.push(acc.k[j]); const ob = o?.[defs[j].obj]; out.push(ob ? acc.k[j] / ob : null);
      if (conBD && k === "CCC UNG") { out.push(acc.bd); const ob2 = o?.["BD UNG"]; out.push(ob2 ? acc.bd / ob2 : null); }
    });
    return out;
  };
  return {raiz: T.raiz, vals, cols, vacio: acc => acc.n === 0, orden: 0, conNodo: true};
}

// ---- CNC: clientes activos que no compraron
function tablaCNC(claves, mes) {
  const defs = claves.map(k => CNC_DEF[k]);
  const flags = D.A.map(a => defs.map(f => f(a)));
  const compra = new Map();
  scan(mes, (c, a, h) => {
    let r = compra.get(c); if (!r) { r = new Float64Array(defs.length); compra.set(c, r); }
    const fl = flags[a]; for (let j = 0; j < defs.length; j++) if (fl[j]) r[j] += h;
  });
  const T = arbol(["sup", "vend", "cli"], () => ({k: new Float64Array(defs.length), n: 0}));
  D.C.forEach((cl, c) => {
    if (!cliOk[c] || cl.fantasma || cl.anulado === "SI") return;
    const r = compra.get(c);
    for (const n of T.nodos(c, 0)) { for (let j = 0; j < defs.length; j++) if (!r || r[j] <= 0) n.acc.k[j]++; n.acc.n++; }
  });
  return {raiz: T.raiz, vals: acc => [acc.n, ...acc.k], cols: [{t: "Clientes", f: fIntZ}, ...claves.map(k => ({t: k, f: fInt, cls: () => "cnc"}))],
          vacio: acc => acc.n === 0, orden: 1, hojaFmt: (v, j) => j === 0 ? "" : v ? "✕" : ""};
}

// ---- P1&P4 VALUE: CCC Quilmes 1890 por calibre
function tablaP1P4(mes) {
  const cals = new Map();
  scan(mes, (c, a, h) => { if (D.C[c].p1p4 && D.A[a].marcaDs === "QUILMES 1890") cals.set(D.A[a].calTxt, 0); });
  const lista = [...cals.keys()].sort();
  const porCli = new Map();
  scan(mes, (c, a, h) => {

  });
  const T = arbol(["sup", "vend", "cli"], () => new Float64Array(lista.length + 1));

  return {raiz: T.raiz, vals: acc => [...acc], cols: [...lista.map(l => ({t: l, f: fInt})), {t: "Total", f: fInt, grp: true}],
          vacio: acc => !acc[lista.length], orden: lista.length};
}

// ---- evolución mensual HL
function tablaEvol(niveles, meses) {

// ---- distribución: palets / bultos / HL
function tablaDistri(mes) {

function graficoEvol(meses) {
  const tot = new Map();
  const porMes = meses.map(m => { const mp = new Map(); scan(m, (c, a, h) => { const k = D.A[a].marcaAgr; mp.set(k, (mp.get(k) || 0) + h); tot.set(k, (tot.get(k) || 0) + h); }); return mp; });
  const top = [...tot.entries()].sort((a, b) => b[1] - a[1]).slice(0, 7).map(x => x[0]);
  const series = [...top, "Otras"];
  const datos = porMes.map(mp => { const v = series.map(s => s === "Otras" ? [...mp.entries()].filter(([k]) => !top.includes(k)).reduce((x, [, y]) => x + y, 0) : (mp.get(s) || 0)); return v.map(x => Math.max(0, x)); });
  const W = 1100, H = 300, ml = 56, mr = 12, mt = 12, mb = 28;
  const maxY = Math.max(1, ...datos.map(v => v.reduce((a, b) => a + b, 0)));
  const paso = niceStep(maxY / 4); const yMax = Math.ceil(maxY / paso) * paso;
  const bw = (W - ml - mr) / meses.length, barW = Math.min(46, bw * 0.62);
  const y = v => mt + (H - mt - mb) * (1 - v / yMax);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="HL por mes y marca">`;
  for (let v = 0; v <= yMax + 1e-9; v += paso) svg += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "#c2c2c2" : "#e7e7e7"}" stroke-width="1"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#666">${nf0.format(v)}</text>`;
  datos.forEach((vals, i) => {
    const x = ml + bw * i + (bw - barW) / 2; let acum = 0;
    vals.forEach((v, s) => {
      if (v <= 0) return;
      const y0 = y(acum), y1 = y(acum + v); acum += v;
      const h = Math.max(0, y0 - y1 - 2);
      const esTope = vals.slice(s + 1).every(z => z <= 0);
      const col = s < 7 ? SERIES[s] : OTROS_COLOR;
      svg += esTope ? `<path d="${topRounded(x, y1, barW, h, 4)}" fill="${col}"/>` : `<rect x="${x}" y="${y1}" width="${barW}" height="${h}" fill="${col}"/>`;
    });
    svg += `<text x="${x + barW / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#666">${mesTxt(meses[i])}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${ml + bw * i}" y="${mt}" width="${bw}" height="${H - mt - mb}" fill="transparent"/>`;
  });
  svg += `</svg>`;
  const box = el("div", {class: "chart", html: svg});
  const tip = el("div", {class: "tip hidden"}); box.append(tip);
  box.querySelectorAll(".hit").forEach(r => {
    r.addEventListener("mousemove", e => {
      const i = +r.dataset.i; const vals = datos[i]; const t = vals.reduce((a, b) => a + b, 0);
      tip.innerHTML = `<b>${mesTxtLargo(meses[i])}</b><table>${series.map((s, k) => vals[k] > 0.05 ? `<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${k < 7 ? SERIES[k] : OTROS_COLOR}"></i> ${s}</td><td>${nf1.format(vals[k])}</td></tr>` : "").reverse().join("")}<tr><td><b>Total</b></td><td><b>${nf1.format(t)}</b></td></tr></table>`;
      tip.classList.remove("hidden");
      const bb = box.getBoundingClientRect(); let lx = e.clientX - bb.left + 14; if (lx + 220 > bb.width) lx -= 240;
      tip.style.left = lx + "px"; tip.style.top = Math.max(0, e.clientY - bb.top - 40) + "px";
    });
    r.addEventListener("mouseleave", () => tip.classList.add("hidden"));
  });
  const leg = el("div", {class: "legend"}, ...series.map((s, k) => el("span", {}, el("i", {style: `background:${k < 7 ? SERIES[k] : OTROS_COLOR}`}), s)));
  return el("div", {}, leg, box);
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function topRounded(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`; }

  // listas de AJUSTES (todos las leen) y, si es administrador, usuarios y estado
  const cfg = async n => { try { return (await fs.getDoc(fs.doc(db, "tablero_config", n))).data() || null; } catch { return undefined; } };
  const [mapeos, usuarios, estado] = await Promise.all([cfg("mapeos"), cfg("usuarios"), cfg("estado")]);
  iniciar(docs, "Firebase", {mapeos, usuarios, estado, meta, esAdmin: usuarios !== undefined && usuarios !== null});
}
async function arrancar() {
  // ?archivo=URL  -> abre un archivo publicado (útil para probar)
  const url = new URLSearchParams(location.search).get("archivo");
  if (url) { const r = await fetch(url); return leerArchivo(new File([await r.blob()], "datos.json.gz")); }
  if (!FIREBASE_CONFIG.apiKey) { $("#pantallaArchivo").classList.remove("hidden"); return; }
  await conFirebase();
  FB.auth.onAuthStateChanged(FB.a, async u => {
    if (!u) { $("#app").classList.add("hidden"); $("#pantallaLogin").classList.remove("hidden"); $("#btnSalir").classList.add("hidden"); $("#btnRecargar").classList.add("hidden"); return; }
    $("#pantallaLogin").classList.add("hidden"); $("#btnSalir").classList.remove("hidden"); $("#btnRecargar").classList.remove("hidden");
    try { await cargarDesdeFirebase(); }
    catch (e) {
      const sinPermiso = /permission|insufficient/i.test(e.message || e.code || "");
      $("#cargando").innerHTML = sinPermiso ? `Tu usuario (<b>${u.email}</b>) todavía no está habilitado. Pedile acceso a Ivo.<br><br><button class="btn" id="btnOtro">Entrar con otra cuenta</button>`
                                            : "Error: " + e.message;
      $("#btnOtro")?.addEventListener("click", () => FB.auth.signOut(FB.a));
    }
  });
}
$("#btnGoogle").addEventListener("click", async () => {
  $("#errLogin").textContent = "";
  try { await FB.auth.signInWithPopup(FB.a, new FB.auth.GoogleAuthProvider()); }
  catch (e) { if (!/popup-closed|cancelled/.test(e.code || "")) $("#errLogin").textContent = "No se pudo entrar con Google: " + (e.code || e.message); }
});
$("#btnLogin").addEventListener("click", async () => {
  $("#errLogin").textContent = "";
  try { await FB.auth.signInWithEmailAndPassword(FB.a, $("#email").value.trim(), $("#pass").value); }
  catch (e) { $("#errLogin").textContent = "Usuario o contraseña incorrectos."; }
});
$("#pass").addEventListener("keydown", e => e.key === "Enter" && $("#btnLogin").click());
$("#btnSalir").addEventListener("click", () => FB.auth.signOut(FB.a));
$("#btnRecargar").addEventListener("click", () => cargarDesdeFirebase().catch(e => alert(e.message)));
arrancar();
</script>
</body>
